[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-capability-tournament"
version = "0.1.0"
description = "Continuous paper-FLOP market for proving what FLOP agents can do."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Greg Smith" }]
dependencies = [
    "cryptography>=42,<51",
    "PyYAML>=6.0,<7",
    "flop-work-exchange @ git+https://github.com/greg2718/flop-work-exchange.git@main",
]

[project.optional-dependencies]
dev = [
    "mypy==1.19.1",
    "pytest==8.4.2",
    "ruff==0.16.5",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
flop-capability-tournament = "flop_capability_tournament.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flop_capability_tournament = ["data/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["flop_capability_tournament"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
